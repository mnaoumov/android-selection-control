org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# A build daemon nobody uses for 15 min exits. Gradle's default is 3 h, and an unattended item that
# builds once left its daemons holding 1.2 GB long after it ended (2026-10-23).
org.gradle.daemon.idletimeout=900000
# Compile Kotlin inside the Gradle daemon, so there is no second JVM with its own 2 h idle timeout.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
